#KITTY FONT CONFIGURATION

font_size        16

# Cell height cut to the tallest ASCII glyph plus ~5%: the beam cursor and
# the line pitch both follow the cell, and stock line heights leave ~9px of
# air at 16pt on Retina. kitty trims cells from the bottom, so the baseline
# is raised by the slack that sat above the ascenders (pt; 1pt = 2px on
# Retina). Values are PER FONT, tuned at font_size 16 with the offline
# harness (regular and bold faces both fit, no ASCII clipping):
#   MonoLisaCode Trial (Regular base)     cell_height 80%  baseline 2.5
#   JetBrainsMono NFM SemiBold base       cell_height 82%  baseline 2
# Capital accents (É Ñ Å) lose their top ~2px on JetBrains; zooming away
# from 16 can clip a pixel. Accent-safe (JetBrains): 93% + 0.5.
modify_font      cell_height 80%
modify_font      baseline    2.5

# Keep ONE font choice active. Install an alternative before uncommenting it.
# New Kitty instances use this choice; auto-reload is disabled in kitty.conf.
#
# The base face is heavier than Regular on purpose: Regular reads too thin
# over the translucent background even with text_composition_strategy raised.
# A heavy base makes the `auto` slots misfire (kitty picks any bold-flagged
# face, so a SemiBold base got SemiBold "bold" text), so all four slots are
# pinned. Re-pin them when switching to a parked choice below.

# MonoLisa Code TRIAL (monolisa.dev): Regular+Bold only, limited charset,
# personal-use licence, no redistribution (files live in ~/Library/Fonts,
# never in this repo). Under evaluation since 2026-09-13; glyphs the trial
# lacks fall back to other installed fonts (the trial is printable ASCII
# ONLY: accents, symbols and icons are NOT MonoLisa in this preview).
font_family      family="MonoLisaCode Trial" style=Regular
bold_font        family="MonoLisaCode Trial" style=Bold
italic_font      family="MonoLisaCode Trial" style="Regular Italic"
bold_italic_font family="MonoLisaCode Trial" style="Bold Italic"

# JetBrains Mono, SemiBold (600) base: between Medium and Bold, real Bold kept
# for bold text. brew install --cask font-jetbrains-mono-nerd-font (installed)
# Parked during the MonoLisa trial; pair with modify_font 82% + baseline 2.
# font_family      family="JetBrainsMono Nerd Font Mono" style=SemiBold
# bold_font        family="JetBrainsMono Nerd Font Mono" style=Bold
# italic_font      family="JetBrainsMono Nerd Font Mono" style="SemiBold Italic"
# bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"

# Mononoki (madmalik.github.io/mononoki), Nerd Font build. Only Regular and
# Bold exist, so Bold was the base and bold text matched regular.
# brew install --cask font-mononoki-nerd-font (installed)
# font_family    family="Mononoki Nerd Font Mono" style=Bold
# italic_font    family="Mononoki Nerd Font Mono" style="Bold Italic"

# Iosevka Term: brew install --cask font-iosevka-term-nerd-font (installed).
# font_family    family="IosevkaTerm Nerd Font Mono"

# Maple Mono: brew install --cask font-maple-mono-nf
# font_family    family="Maple Mono NF"

# Monaspace Neon (Nerd Fonts rename): brew install --cask font-monaspice-nerd-font
# font_family    family="MonaspiceNe Nerd Font Mono"

# IBM Plex Mono (Nerd Fonts rename): brew install --cask font-blex-mono-nerd-font
# font_family    family="BlexMono Nerd Font Mono"

# Fira Code: brew install --cask font-fira-code-nerd-font
# font_family    family="FiraCode Nerd Font Mono"

# Victor Mono: brew install --cask font-victor-mono-nerd-font
# font_family    family="VictorMono Nerd Font Mono"

disable_ligatures never


# Prompt dagger/skull: starship emits the VS16 emoji form (colorful, via
# kitty's natural Apple Color Emoji fallback) but VS16 makes kitty draw 2
# cells while zsh/libc count 1, desyncing the cursor. narrow_symbols pins
# the rendered width back to 1 so both sides agree. (symbol_map to the emoji
# font is the wrong tool: it overrides the fallback and loses the color.)
narrow_symbols U+1F5E1,U+2620 1
