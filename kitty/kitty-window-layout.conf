# All stock layouts, splits first: new windows start in splits, and
# cmd+shift+l cycles kitty's normal layout ring (arriving evenly
# distributed via the reset in its mapping). The cmd+shift+arrow splits are
# a kitten (split_dir.py) so that splitting FROM a cycled layout converts
# back to splits without deforming the other windows.
enabled_layouts splits,*
draw_minimal_borders yes

window_padding_width 4
