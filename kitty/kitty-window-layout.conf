# splits only, plus stack as a zoom: launch --location=vsplit/hsplit always
# actually splits, and ctrl+shift+l becomes a clean splits<->stack toggle
# (stack = current pane fullscreen). The old splits,* let layout cycling
# strand a window in fat/grid/horizontal, where --location is ignored and
# panes pile into a row — the "broken windows" incident of 2026-08-30.
enabled_layouts splits,stack
draw_minimal_borders yes

window_padding_width 4
