include kitty-font.conf
include kitty-cursor.conf
include kitty-window-layout.conf

# Colors are managed by the `theme` command (see ~/.config/scripts/README.md)
# current-theme.conf points at either pywal colors or a static theme
include current-theme.conf

# Remote control over a private socket so `theme` can recolor running windows
# (SIGUSR1 reload is not honored by a running instance on macOS). Authority is
# capability-scoped, not open: password mode + an empty-password grant means a
# passwordless socket client may call set-colors and NOTHING else — no
# send-text, no launch, no window reads (Codex security review, dotfiles PR).
allow_remote_control password
listen_on unix:/tmp/kitty-samuel
remote_control_password "" set-colors

# Keep pasted commands single-line and strip terminal control sequences before
# they reach ZLE. Intentional multi-line scripts should be saved and reviewed as
# files instead of pasted directly into an interactive shell.
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes,replace-newline,confirm-if-large

# Open tabs and windows in the same folder
map kitty_mod+enter new_window_with_cwd
map cmd+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map cmd+t new_tab_with_cwd

# Split the current window in two, 50/50, the new window starting in the same
# directory as the parent — no other relationship between them. Arrow = where
# the NEW window lands (left/up = same split, then swap into place).
map cmd+shift+right launch --location=vsplit --bias=50 --cwd=current
map cmd+shift+down  launch --location=hsplit --bias=50 --cwd=current
map cmd+shift+left  combine : launch --location=vsplit --bias=50 --cwd=current : move_window left
map cmd+shift+up    combine : launch --location=hsplit --bias=50 --cwd=current : move_window up

enable_audio_bell no
visual_bell_duration 0.0
open_url_with default

background_opacity 0.70
background_blur 40

hide_window_decorations yes

shell /bin/zsh
confirm_os_window_close 1
