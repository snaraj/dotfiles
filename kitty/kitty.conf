include kitty-font.conf
include kitty-cursor.conf
include kitty-window-layout.conf

# Colors are managed by the `theme` command (github.com/snaraj/theme)
include current-theme.conf

# The include chain reaches theme's palette cache, rewritten on every
# run — with auto-reload on (default 0.1s), each theme change became a FULL
# config reload, resetting font-size zoom and pane state. Negative = off; live
# recolor arrives over the remote-control socket instead, and fresh launches
# read the include at startup. (Root cause of the 2026-08-30 zoom-reset hunt.)
auto_reload_config -1

# Remote control over a private socket so `theme` can recolor running windows —
# the only path, now that auto-reload is off above. Authority is
# capability-scoped, not open: password mode + an empty-password grant means a
# passwordless socket client may call set-colors and NOTHING else — no
# send-text, no launch, no window reads (Codex security review, dotfiles PR).
allow_remote_control password
listen_on unix:/tmp/kitty-samuel
remote_control_password "" set-colors

# Strip dangerous control sequences from pastes and confirm very large ones.
# Multi-line pastes are left intact: zsh's bracketed paste already holds the
# whole paste in the editing buffer without executing until Enter, and the
# former replace-newline action was silently mangling legitimate multi-line
# pastes into nvim, REPLs, and heredocs.
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large

# Default is `mouse_handle_click selection link prompt`. The `prompt` arm
# moves the cursor to the clicked column by SYNTHESIZING arrow-key presses —
# a click right of the text sends a run of forward-char, which is exactly the
# autosuggestion accept widget, so clicking to copy while a suggestion showed
# silently pulled it into the buffer. Selection and links only.
mouse_map left click ungrabbed mouse_handle_click selection link

# Open tabs and windows in the same folder
map kitty_mod+enter new_window_with_cwd
map cmd+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map cmd+t new_tab_with_cwd

# cmd+shift+l = kitty's normal layout cycle, each layout arriving in its
# default evenly-distributed shape (the reset drops stale manual sizes).
# Splitting from any cycled layout is safe: the split_dir kitten below
# converts back to splits without deforming the other windows.
map cmd+shift+l combine : next_layout : resize_window reset

# Split the current window in two, 50/50, the new window starting in the
# same directory as the parent. Arrow = where the NEW window lands. The
# split_dir kitten converts a cycled layout back to splits WITHOUT deforming
# the other windows: it captures their on-screen rectangles and rebuilds the
# splits tree to reproduce them, so grids stay grids and thirds stay thirds
# (see its header). Inside splits it only ever divides the focused window.
map cmd+shift+right kitten split_dir.py right
map cmd+shift+down  kitten split_dir.py down
map cmd+shift+left  kitten split_dir.py left
map cmd+shift+up    kitten split_dir.py up

enable_audio_bell no
visual_bell_duration 0.0
open_url_with default

background_opacity 0.60
background_blur 0

# Text contrast over the translucent background, two independent levers:
#  - text_composition_strategy <gamma> <extra-contrast%>: how glyphs blend
#    with what is behind them. macOS default ("platform") renders thin, low-
#    contrast text; 1.7 30 is the dense legacy blend. Raise the second number
#    (up to 100) for even more contrast on light wallpapers.
#  - live opacity: cmd+alt+up/down step ±0.05, cmd+alt+0 returns to the
#    configured value above. Light wallpapers read best nearer 0.85.
# The PALETTE is the primary lever, not these: see THEME_CONTRAST in
# theme/README.md, which floors contrast against the blended background.
text_composition_strategy 1.7 30
dynamic_background_opacity yes
map cmd+alt+up   set_background_opacity +0.05
map cmd+alt+down set_background_opacity -0.05
map cmd+alt+0    set_background_opacity default

hide_window_decorations yes

# No scrollbar overlay while scrolling back (kitty 0.48 defaults to showing one)
scrollbar never

shell /bin/zsh
confirm_os_window_close 1
