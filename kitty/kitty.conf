include kitty-font.conf
include kitty-cursor.conf
include kitty-window-layout.conf

# Colors are managed by the `theme` command (see ~/.config/scripts/README.md)
# current-theme.conf points at either pywal colors or a static theme
include current-theme.conf

# Keep pasted commands single-line and strip terminal control sequences before
# they reach ZLE. Intentional multi-line scripts should be saved and reviewed as
# files instead of pasted directly into an interactive shell.
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes,replace-newline,confirm-if-large

# Open tabs and windows in the same folder
map kitty_mod+enter new_window_with_cwd
map cmd+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map cmd+t new_tab_with_cwd

enable_audio_bell no
visual_bell_duration 0.0
open_url_with default

background_opacity 0.70
background_blur 40

hide_window_decorations yes

shell /bin/zsh
confirm_os_window_close 1
